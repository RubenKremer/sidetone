[transport-udp]
type=transport
protocol=udp
bind=127.0.0.1:5070

[transport-tcp]
type=transport
protocol=tcp
bind=127.0.0.1:5070

; Self-signed certificate made by run-asterisk.sh (Sidetone: turn off certificate check).
[transport-tls]
type=transport
protocol=tls
bind=127.0.0.1:5071
cert_file=@DIR@/lab.crt
priv_key_file=@DIR@/lab.key
method=tlsv1_2

[2001]
type=endpoint
context=test
disallow=all
allow=ulaw,alaw,opus,g722,gsm,g726,g726aal2,speex,speex16,slin,slin16,slin44,ilbc,g729
incoming_call_offer_pref=remote
auth=2001-auth
aors=2001
direct_media=no
rtp_symmetric=yes
dtmf_mode=rfc4733
[2001-auth]
type=auth
auth_type=userpass
username=2001
password=secret2001
[2001]
type=aor
max_contacts=2
remove_existing=yes

[3001]
type=endpoint
context=test
disallow=all
allow=ulaw
auth=3001-auth
aors=3001
direct_media=no
[3001-auth]
type=auth
auth_type=userpass
username=3001
password=secret3001
[3001]
type=aor
max_contacts=2
remove_existing=yes

[transport-ws]
type=transport
protocol=ws
bind=127.0.0.1

[4001]
type=endpoint
context=test
disallow=all
allow=opus,ulaw
auth=4001-auth
aors=4001
webrtc=yes
dtls_auto_generate_cert=yes
[4001-auth]
type=auth
auth_type=userpass
username=4001
password=secret4001
[4001]
type=aor
max_contacts=5
remove_existing=yes

; SRTP (SDES) test user: media must be encrypted.
[5001]
type=endpoint
context=test
disallow=all
allow=ulaw,alaw
auth=5001-auth
aors=5001
direct_media=no
rtp_symmetric=yes
dtmf_mode=rfc4733
media_encryption=sdes
[5001-auth]
type=auth
auth_type=userpass
username=5001
password=secret5001
[5001]
type=aor
max_contacts=2
remove_existing=yes

; DTLS-SRTP test user (RFC 5763/5764) without ICE.
[6001]
type=endpoint
context=test
disallow=all
allow=ulaw,alaw,opus
auth=6001-auth
aors=6001
direct_media=no
rtp_symmetric=yes
dtmf_mode=rfc4733
media_encryption=dtls
dtls_verify=fingerprint
dtls_setup=actpass
dtls_auto_generate_cert=yes
ice_support=no
[6001-auth]
type=auth
auth_type=userpass
username=6001
password=secret6001
[6001]
type=aor
max_contacts=2
remove_existing=yes

; Unauthenticated calls (direct SIP URI dialing tests) land here and only reach the echo test.
[anonymous]
type=endpoint
context=anon
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
dtmf_mode=rfc4733
