[transport-udp]
type=transport
protocol=udp
bind=127.0.0.1:5070

[2001]
type=endpoint
context=test
disallow=all
allow=ulaw,alaw
auth=2001-auth
aors=2001
direct_media=no
rtp_symmetric=yes
dtmf_mode=rfc4733
[2001-auth]
type=auth
auth_type=userpass
username=2001
password=secret2001
[2001]
type=aor
max_contacts=2
remove_existing=yes

[3001]
type=endpoint
context=test
disallow=all
allow=ulaw
auth=3001-auth
aors=3001
direct_media=no
[3001-auth]
type=auth
auth_type=userpass
username=3001
password=secret3001
[3001]
type=aor
max_contacts=2
remove_existing=yes

[transport-ws]
type=transport
protocol=ws
bind=127.0.0.1

[4001]
type=endpoint
context=test
disallow=all
allow=opus,ulaw
auth=4001-auth
aors=4001
webrtc=yes
dtls_auto_generate_cert=yes
[4001-auth]
type=auth
auth_type=userpass
username=4001
password=secret4001
[4001]
type=aor
max_contacts=5
remove_existing=yes

; Unauthenticated calls (direct SIP URI dialing tests) land here and only reach the echo test.
[anonymous]
type=endpoint
context=anon
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
dtmf_mode=rfc4733
