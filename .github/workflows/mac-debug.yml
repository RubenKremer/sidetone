name: macOS bundle check

# Builds the macOS desktop bundle and reports the end of the log as
# annotations when it fails. Push the mac-debug branch to run it.
on:
  push:
    branches: [mac-debug]

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-macos-x64
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        shell: bash
        run: |
          cd app
          set -o pipefail
          if ! npx --yes @tauri-apps/cli@2 build --target x86_64-apple-darwin 2>&1 | tee ../build.log; then
            grep -v '^\s*Compiling' ../build.log | tail -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
