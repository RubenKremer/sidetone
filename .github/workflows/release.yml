name: Release

# Builds the CLI and the desktop app for Linux, Windows and macOS and
# attaches everything to one GitHub pre-release. Triggered by a tag like
# v0.1.0, or by pushing the `release` branch (the tag is then v + the
# workspace version, created by this workflow).
on:
  push:
    tags: ["v*"]
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: Create the release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then tag="${GITHUB_REF_NAME}"; else
            tag="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.t.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Sidetone ${{ steps.t.outputs.tag }}
          prerelease: false
          body: |
            Alpha build of Sidetone. Desktop app: the installer for your system (.msi or -setup.exe on Windows, .dmg on macOS, .AppImage, .deb or .rpm on Linux). Command line: the sidetone-* archive for your platform.

            The installers are not signed yet: on Windows choose "More info, Run anyway"; on macOS right-click the app and choose Open the first time.

  cli:
    name: CLI ${{ matrix.target }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Sound card headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build
        run: cargo build --release -p sidetone-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="sidetone-${{ needs.meta.outputs.tag }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/sidetone${{ matrix.ext }}" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          cp -r examples "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "$name.zip" "$name" > /dev/null; else tar czf "$name.tar.gz" "$name"; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          prerelease: false
          files: |
            dist/*.tar.gz
            dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/*.*z*

  desktop:
    name: Desktop ${{ matrix.label }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, label: linux-x64, args: "" }
          - { os: windows-latest, label: windows-x64, args: "" }
          - { os: macos-latest, label: macos-arm64, args: "--target aarch64-apple-darwin" }
          - { os: macos-latest, label: macos-x64, args: "--target x86_64-apple-darwin" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.label }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing: add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
          # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID here
          # once the secrets exist. Empty values make the macOS build fail.
        with:
          projectPath: app
          tauriScript: npx --yes @tauri-apps/cli@2
          args: ${{ matrix.args }}
          tagName: ${{ needs.meta.outputs.tag }}
          releaseName: Sidetone ${{ needs.meta.outputs.tag }}
          releaseDraft: false
          prerelease: false
